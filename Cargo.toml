

[workspace]
members = ["pioc-core", "pioc-parser", "pioc-proc", "pioc-vm", "pioc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andelf/pioc"
rust-version = "1.81"

[workspace.dependencies]
pioc-core = { path = "pioc-core" }
pioc-parser = { path = "pioc-parser" }
pioc-proc = { path = "pioc-proc" }
pioc-vm = { path = "pioc-vm" }
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
