[workspace]
members = ["pioc-core", "pioc-parser", "pioc-proc", "pioc-vm", "pioc-programs", "pioc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andelf/pioc"
homepage = "https://github.com/andelf/pioc"
rust-version = "1.81"
keywords = ["wch", "pioc", "ch32", "assembler", "embedded"]
categories = ["embedded", "hardware-support", "development-tools::build-utils"]

[workspace.dependencies]
# `version` alongside `path`: crates.io rejects a dependency that only has a
# path, so every in-workspace crate carries both.
pioc-core = { path = "pioc-core", version = "0.1.0" }
pioc-parser = { path = "pioc-parser", version = "0.1.0" }
pioc-vm = { path = "pioc-vm", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
